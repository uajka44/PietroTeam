<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grafik — Piętro Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f0e0c; color: #e8e0d0;
    font-family: 'Courier Prime', monospace;
    min-height: 100vh; padding: 24px 16px 80px;
  }

  .logo { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#f5a623; letter-spacing:5px; text-align:center; }
  .sub  { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#5a5248; text-align:center; margin-bottom:20px; }

  /* --- NAWIGACJA MIESIĘCY --- */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 420px; margin: 0 auto 18px;
    background: #1a1814; border: 1px solid #2e2a22; border-radius: 8px;
    padding: 4px;
  }
  .month-btn {
    background: none; border: none; color: #8a8070; font-size: 20px;
    cursor: pointer; padding: 10px 16px; border-radius: 6px; transition: all 0.15s;
  }
  .month-btn:hover { color: #f5a623; background: #0f0e0c; }
  .month-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px;
    color: #e8e0d0; text-align: center; flex: 1;
  }

  /* --- DZIEŃ --- */
  .day-list { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  .day-card {
    background: #1a1814; border: 1px solid #2e2a22; border-radius: 8px;
    padding: 12px 14px;
    opacity: 1; transition: opacity 0.1s;
  }
  .day-card.past { opacity: 0.45; }
  .day-card.today { border-color: #f5a623; }
  .day-card.weekend { background: #181512; }

  .day-head {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
  }
  .day-num {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
    color: #e8e0d0;
  }
  .day-card.today .day-num { color: #f5a623; }
  .day-name { font-size: 11px; color: #5a5248; letter-spacing: 2px; text-transform: uppercase; }
  .today-badge {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: #f5a623; background: #2a1e08; border: 1px solid #f5a623;
    border-radius: 3px; padding: 2px 6px; margin-left: auto;
  }

  .shift-row { display: flex; gap: 8px; align-items: flex-start; }
  .shift-lbl {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: #3e3a32; width: 28px; flex-shrink: 0; padding-top: 1px;
  }
  .shift-names { font-size: 13px; color: #8a8070; flex: 1; line-height: 1.5; }
  .shift-names .me { color: #f5a623; font-weight: 700; }
  .shift-names .other { color: #8a8070; }
  .shift-empty { color: #2e2a22; font-size: 12px; }

  /* --- SPINNER / STANY --- */
  .state-box {
    max-width: 420px; margin: 40px auto; text-align: center;
    color: #5a5248; font-size: 13px; letter-spacing: 1px;
  }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 2px solid #2e2a22; border-top-color: #f5a623;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sheet-info {
    max-width: 420px; margin: 14px auto 0; text-align: center;
    font-size: 10px; letter-spacing: 2px; color: #2e2a22;
  }

  /* --- SETUP --- */
</style>
</head>
<body>

<div class="logo">Piętro Cafe</div>
<div class="sub">grafik pracy</div>

<div id="mainSection">
  <div class="month-nav">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div id="content"></div>
</div>

<script>
const MIESIACE_DIA = ['styczeń','luty','marzec','kwiecień','maj','czerwiec',
                      'lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MIESIACE_NODIA = ['styczen','luty','marzec','kwiecien','maj','czerwiec',
                        'lipiec','sierpien','wrzesien','pazdziernik','listopad','grudzien'];
const MIESIACE_DISPLAY = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                          'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DNI = ['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];
// nazwy dni z kolumny B — służą do sprawdzenia, czy trafiliśmy w dobry arkusz
const DNI_PELNE = { 'niedziela':0, 'poniedziałek':1, 'wtorek':2, 'środa':3,
                    'czwartek':4, 'piątek':5, 'sobota':6 };

const SHEET_ID = '1oT_PYdf-UnFosZ_AlVaN3d-qsMogRUs-O3gyfCMwWXM';

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let _req = 0;   // licznik żądań — chroni przed wyścigiem przy szybkim klikaniu strzałkami

// ─── NAWIGACJA ────────────────────────
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  loadMonth(currentYear, currentMonth);
}

// ─── SZUKANIE ZAKŁADKI ───────────────
// Zakładki są nazywane różnie: "wrzesien 26" (bez ogonków), "Sierpień 25" (z wielkiej),
// "Grudzień2025" (bez spacji, pełny rok), " wrzesień 25" (ze spacją na początku)…
// Google przy nietrafionej nazwie NIE zgłasza błędu — po cichu zwraca pierwszą zakładkę
// skoroszytu. Dlatego próbujemy wariantów nazwy i za każdym razem sprawdzamy, co przyszło.
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function sheetCandidates(year, month) {
  const lata = [String(year).slice(2), String(year)];
  const bazy = [MIESIACE_NODIA[month], MIESIACE_DIA[month]];
  const out = [];
  [' ', ''].forEach(sep => lata.forEach(y => bazy.forEach(b => {
    out.push(b + sep + y);
    out.push(cap(b) + sep + y);
  })));
  return [...new Set(out.concat(out.map(n => ' ' + n)))];
}

const TAB_CACHE_KEY = 'pietro_grafik_zakladki';
function cachedTab(year, month) {
  try { return (JSON.parse(localStorage.getItem(TAB_CACHE_KEY)) || {})[year + '-' + month] || null; }
  catch(e) { return null; }
}
function cacheTab(year, month, name) {
  try {
    const m = JSON.parse(localStorage.getItem(TAB_CACHE_KEY)) || {};
    m[year + '-' + month] = name;
    localStorage.setItem(TAB_CACHE_KEY, JSON.stringify(m));
  } catch(e) {}
}

async function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const csv = await res.text();
  if (csv.includes('Workbook not found') || csv.trim().length < 5) return null;
  return parseCSV(csv);
}

// Wyciąga dni z wierszy: kolA = data, kolB = dzień tygodnia, kolC = zm1, kolD = zm2.
// Starsze arkusze mają w kolumnie A format DD/MM, nowsze MM/DD — stąd przełącznik `dmy`.
function extractDays(rows, year, month, dmy) {
  const days = [];
  rows.forEach(row => {
    if (!row[0]) return;
    const raw = String(row[0]).trim();
    let d = null;
    const m1 = raw.match(/^(\d{1,2})\/(\d{1,2})$/);
    const m2 = raw.match(/^(\d{1,2})\.(\d{1,2})\.?$/); // 01.09 — zawsze DD.MM
    if (m1) {
      const a = parseInt(m1[1]), b = parseInt(m1[2]);
      d = dmy ? new Date(year, b-1, a) : new Date(year, a-1, b);
    }
    else if (m2) d = new Date(year, parseInt(m2[2])-1, parseInt(m2[1]));
    else d = new Date(raw);
    if (!d || isNaN(d)) return;
    if (d.getMonth() !== month) return;
    days.push({
      date: d,
      dow:  String(row[1]||'').trim().toLowerCase(),
      zm1:  String(row[2]||'').trim(),
      zm2:  String(row[3]||'').trim()
    });
  });
  return days;
}

// Ile dni tygodnia z kolumny B zgadza się z kalendarzem
function zgodnoscDni(days) {
  let sprawdzone = 0, zgodne = 0;
  days.forEach(d => {
    if (DNI_PELNE[d.dow] !== undefined) { sprawdzone++; if (DNI_PELNE[d.dow] === d.date.getDay()) zgodne++; }
  });
  return { sprawdzone, zgodne };
}

// Sprawdza, czy to naprawdę ten miesiąc i ten rok. Google przy nietrafionej nazwie
// podstawia pierwszą zakładkę skoroszytu, więc bez tej kontroli pokazalibyśmy cudze dane.
// Przy okazji wybiera właściwy format daty (DD/MM albo MM/DD).
function validateDays(rows, year, month) {
  let best = null;
  [false, true].forEach(dmy => {
    const days = extractDays(rows, year, month, dmy);
    if (days.length < 5) return;
    const { sprawdzone, zgodne } = zgodnoscDni(days);
    if (sprawdzone >= 3 && zgodne < sprawdzone * 0.8) return;
    const ocena = sprawdzone ? zgodne / sprawdzone : 0.5;
    if (!best || days.length > best.days.length ||
        (days.length === best.days.length && ocena > best.ocena)) {
      best = { days, ocena };
    }
  });
  return best ? best.days : null;
}

// ─── ŁADOWANIE ──────────────────────
async function loadMonth(year, month) {
  const reqId = ++_req;
  const label = MIESIACE_DISPLAY[month] + ' ' + year;
  document.getElementById('monthLabel').textContent = label;
  const content = document.getElementById('content');
  content.innerHTML = `<div class="state-box"><div class="spinner"></div><br>Ładowanie…</div>`;

  const znana = cachedTab(year, month);
  const listy = znana ? [[znana], ...chunk(sheetCandidates(year, month), 4)]
                      : chunk(sheetCandidates(year, month), 4);

  let trafienie = null, blad = null;
  for (const partia of listy) {
    const wyniki = await Promise.all(partia.map(async nazwa => {
      try {
        const rows = await fetchSheet(nazwa);
        return rows ? { nazwa, days: validateDays(rows, year, month) } : null;
      } catch(e) { blad = e; return null; }
    }));
    if (reqId !== _req) return;                 // użytkownik przeszedł do innego miesiąca
    trafienie = wyniki.find(w => w && w.days);
    if (trafienie) break;
  }

  if (reqId !== _req) return;

  if (!trafienie) {
    content.innerHTML = blad
      ? `<div class="state-box">Błąd połączenia.<br><small>${blad.message}</small></div>`
      : `<div class="state-box">Brak grafiku dla: <strong>${label}</strong>
           <br><br><small>Szukam zakładki o nazwie w stylu
           <strong>${MIESIACE_NODIA[month]} ${String(year).slice(2)}</strong>,
           z datami tego miesiąca w kolumnie A<br>i dniami tygodnia w kolumnie B.</small></div>`;
    return;
  }

  cacheTab(year, month, trafienie.nazwa);
  render(trafienie.days, year, month, trafienie.nazwa);
}

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

// ─── RENDER ──────────────────────────────────
function render(days, year, month, nazwaZakladki) {
  const myName  = (localStorage.getItem('pietro_imie') || '').toLowerCase();
  const today   = new Date();
  const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  // Stałe kolory per imię — zmień tutaj jeśli chcesz inny kolor dla danej osoby
  const NAME_MAP = {
    'justyna':  '#c83030',
    'weronika': '#d46818',
    'julia':    '#1878d4',
    'gaba':     '#18a83c',
    'gabi':     '#18a83c',
    'angelika': '#8f20c8',
    'gloria':   '#c82080',
  };
  // Zapasowa paleta dla nieznanych imion
  const NAME_COLORS_FALLBACK = [
    '#c83030','#d46818','#c8b820','#18a83c','#18c0a0',
    '#1878d4','#4840d4','#8f20c8','#c82080','#20a8c8',
  ];
  function nameColor(name) {
    const key = name.toLowerCase().trim();
    if (NAME_MAP[key]) return NAME_MAP[key];
    let h = 5381;
    for (let i = 0; i < key.length; i++) h = ((h * 33) ^ key.charCodeAt(i)) & 0xffff;
    return NAME_COLORS_FALLBACK[Math.abs(h) % NAME_COLORS_FALLBACK.length];
  }
  function textOnBg(hex) {
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    const lin = x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4);
    const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
    return L > 0.35 ? '#1a1814' : '#f5f0e8';
  }

  function highlightNames(str) {
    if (!str) return '<span class="shift-empty">—</span>';
    return str.split(/[,;]+/).map(n => {
      const name = n.trim();
      if (!name) return '';
      const bg = nameColor(name.toLowerCase());
      const fg = textOnBg(bg);
      return `<span style="background:${bg};color:${fg};font-weight:700;padding:3px 11px;border-radius:20px;display:inline-block;margin:2px 2px;font-size:12px;">${name}</span>`;
    }).filter(Boolean).join(' ');
  }

  const html = days.map(({date, zm1, zm2}) => {
    const dateStr = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    const isToday   = dateStr === todayStr;
    const isPast    = date < today && !isToday;
    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
    const classes   = ['day-card', isToday?'today':'', isPast?'past':'', isWeekend?'weekend':''].filter(Boolean).join(' ');
    const dayLabel  = DNI[date.getDay()] + ' ' + pad(date.getDate()) + '.' + pad(date.getMonth()+1);
    const todayAttr = isToday ? ' id="today-card"' : '';

    return `<div class="${classes}"${todayAttr}>
      <div class="day-head">
        <div class="day-num">${dayLabel}</div>
        ${isToday ? '<span class="today-badge">DZIŚ</span>' : ''}
      </div>
      <div class="shift-row">
        <div class="shift-lbl">ZM1</div>
        <div class="shift-names">${highlightNames(zm1)}</div>
      </div>
      <div class="shift-row">
        <div class="shift-lbl">ZM2</div>
        <div class="shift-names">${highlightNames(zm2)}</div>
      </div>
    </div>`;
  }).join('');

  // Zakładka może już istnieć, ale być jeszcze pusta (kolumny zmian nieuzupełnione)
  const pusty = days.every(d => !d.zm1 && !d.zm2);
  const info = pusty
    ? `<div class="state-box" style="margin:0 auto 14px">Grafik na ten miesiąc nie jest jeszcze uzupełniony.</div>`
    : '';
  const stopka = `<div class="sheet-info">arkusz: ${nazwaZakladki}</div>`;

  document.getElementById('content').innerHTML = info + `<div class="day-list">${html}</div>` + stopka;

  const todayCard = document.getElementById('today-card');
  if (todayCard) {
    setTimeout(() => todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
  }
}

function parseCSV(text) {
  return text.split('\n').map(line => {
    const fields = [];
    let inQuote = false, field = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuote = !inQuote; }
      else if (c === ',' && !inQuote) { fields.push(field.trim()); field = ''; }
      else { field += c; }
    }
    fields.push(field.trim());
    return fields;
  }).filter(row => row.some(f => f));
}

function pad(n) { return String(n).padStart(2,'0'); }

loadMonth(currentYear, currentMonth);
</script>
<script src="nav.js"></script>
</body>
</html>
